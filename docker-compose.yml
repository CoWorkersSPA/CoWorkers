services:
  portfolio:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: coworkers
    ports:
      - "4321:4321"
    volumes:
      # Sync local code into the container for hot-reload
      - .:/app
      # Anonymous volume so node_modules inside container are not overwritten by local (empty) folder
      - /app/node_modules
    environment:
      - NODE_ENV=development
      # Required for file-watching to work correctly on Windows/WSL
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=300
    restart: unless-stopped
    stdin_open: true
    tty: true
